[package]
name = "teamwork-signer"
version = "0.1.0"
edition = "2021"
description = "Reference non-oracle v2 signer for @heretek-ai/opencode-teamwork-v2 (docs/SIGNER-PROTOCOL.md)"
license = "MIT"

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
hex = "0.4"
hmac = "0.12"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
time = { version = "0.3", features = ["parsing", "formatting"] }
