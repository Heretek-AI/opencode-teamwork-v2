# SonarCloud project configuration for Heretek-AI/opencode-teamwork-v2.
#
# This file configures analysis scope only. The quality gate, new-code period
# and branch/PR decoration are server-side settings and must be set in the
# SonarCloud UI; `sonar.qualitygate.wait` is deliberately not used here.
# The rationale and maintenance policy are in
# docs/AUDIT-REMEDIATION-2026-11.md §3.2.1.
#
# Scope: analyse the repository, but never the reverse-engineering corpus.
# `docs/re/**` is research material (captured third-party output, decompiled
# assets, transcripts). It is excluded from the npm tarball as well and is not
# product code, so counting its style/security findings would drown the signal
# from the shipped plugin. `tests/runtime/node_modules/**` is the dev-only
# dependency tree, not source; it is ignored when present locally.
sonar.projectKey=Heretek-AI_opencode-teamwork-v2
sonar.organization=heretek-ai
sonar.sources=.
sonar.exclusions=docs/re/**,tests/runtime/node_modules/**

# Rule-level exclusions. These are deliberately narrow: one rule, one path.
# They are not blanket suppressions and do not disable a rule anywhere else.
sonar.issue.ignore.multicriteria=testSequentialAwait,urlGuardBlocklistIp

# S9382 ("Promises should not be awaited sequentially in a loop") is
# intentional in the test loops under `scripts/test-*.mjs`. The tests share one
# fixture and assert ordered side effects; parallelising the awaits would make
# failures nondeterministic and change what the test proves. This is a test
# harness pattern, not hot-path production code.
sonar.issue.ignore.multicriteria.testSequentialAwait.ruleKey=javascript:S9382
sonar.issue.ignore.multicriteria.testSequentialAwait.resourceKey=scripts/test-*.mjs

# S1313 ("IP addresses should not be hardcoded") fires on the SSRF blocklist in
# `url-guard.mjs`. Those ranges (loopback, private, link-local, cloud metadata)
# are the security policy, not deploy-time configuration; making them
# configurable would let a caller widen the allowlist. The literals are the
# point of the guard and are covered by negative tests.
sonar.issue.ignore.multicriteria.urlGuardBlocklistIp.ruleKey=javascript:S1313
sonar.issue.ignore.multicriteria.urlGuardBlocklistIp.resourceKey=plugins/opencode-teamwork/url-guard.mjs
