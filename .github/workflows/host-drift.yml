name: Nightly OpenCode host drift

# Non-blocking nightly job (Issue #39): resolves the newest published
# @opencode/{plugin,core,sdk,ai} packages and runs tests/runtime against them.
# On drift/failure, opens or updates a single deduplicated issue titled
# "OpenCode host drift" with the resolved versions and diff. Never runs on PRs.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  host-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Capture pinned catalog snapshot
        run: node scripts/diff-host-catalog.mjs --out "$RUNNER_TEMP/catalog-pinned.json"

      - name: Resolve latest @opencode/* packages in isolated copy
        id: resolve
        run: |
          cp -r tests/runtime "$RUNNER_TEMP/runtime-latest"
          node -e '
            const fs = require("fs");
            const p = process.env.RUNNER_TEMP + "/runtime-latest/package.json";
            const pkg = JSON.parse(fs.readFileSync(p, "utf8"));
            for (const dep of ["@opencode/ai", "@opencode/core", "@opencode/plugin", "@opencode/sdk"]) {
              if (pkg.devDependencies[dep]) pkg.devDependencies[dep] = "latest";
            }
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + "\n");
          '
          rm -f "$RUNNER_TEMP/runtime-latest/bun.lock"
          (cd "$RUNNER_TEMP/runtime-latest" && bun install --ignore-scripts) # NOSONAR (S8543): intentional @opencode/*@latest resolution in an isolated copy; --ignore-scripts, no secrets, non-blocking
          node -e '
            const fs = require("fs");
            const base = process.env.RUNNER_TEMP + "/runtime-latest/node_modules";
            const versions = {};
            for (const dep of ["@opencode/ai", "@opencode/core", "@opencode/plugin", "@opencode/sdk", "effect"]) {
              try {
                versions[dep] = JSON.parse(fs.readFileSync(`${base}/${dep}/package.json`, "utf8")).version;
              } catch { versions[dep] = "missing"; }
            }
            fs.writeFileSync(process.env.RUNNER_TEMP + "/host-versions.json", JSON.stringify(versions, null, 2) + "\n");
            console.log("Resolved versions:", JSON.stringify(versions));
          '

      - name: Run L1-L3 runtime suite against @opencode/*@latest
        id: suite
        continue-on-error: true
        run: |
          set +e
          (cd "$RUNNER_TEMP/runtime-latest" && bun test --timeout 30000) > "$RUNNER_TEMP/drift-output.txt" 2>&1
          code=$?
          cat "$RUNNER_TEMP/drift-output.txt"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Upload resolved host versions artifact
        if: steps.suite.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: opencode-host-versions
          path: |
            ${{ runner.temp }}/host-versions.json
            ${{ runner.temp }}/catalog-pinned.json
          retention-days: 30

      - name: Report drift in deduplicated GitHub issue
        if: steps.suite.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const versions = fs.readFileSync(process.env.RUNNER_TEMP + "/host-versions.json", "utf8");
            const output = fs.readFileSync(process.env.RUNNER_TEMP + "/drift-output.txt", "utf8").slice(-6000);
            const title = "OpenCode host drift";
            const body = [
              "Nightly runtime suite failed against `@opencode/*@latest`.",
              "",
              "### Resolved versions",
              "```json",
              versions.trim(),
              "```",
              "",
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "### Failure tail",
              "```text",
              output.trim(),
              "```",
            ].join("\n");

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.data.find((i) => i.title === title && !i.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
