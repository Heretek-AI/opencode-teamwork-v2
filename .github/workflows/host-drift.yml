name: Nightly OpenCode host drift

# Non-blocking nightly job (Issue #39): resolves the newest published
# @opencode/{plugin,core,sdk,ai} packages and runs tests/runtime against them.
# On drift/failure, opens or updates a single deduplicated issue titled
# "OpenCode host drift" with the resolved versions and diff. Never runs on PRs.
#
# The install/test job runs untrusted package code. It has contents:read only,
# no persisted checkout credentials, and no issue-write token. A separate
# report job downloads the captured diagnostics and holds issues:write.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Resolve and test @opencode/*@latest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      exit_code: ${{ steps.suite.outputs.exit_code }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Capture pinned catalog snapshot
        run: node scripts/diff-host-catalog.mjs --out "$RUNNER_TEMP/catalog-pinned.json"

      - name: Resolve latest @opencode/* packages in isolated copy
        id: resolve
        run: |
          cp -r tests/runtime "$RUNNER_TEMP/runtime-latest"
          node -e '
            const fs = require("fs");
            const p = process.env.RUNNER_TEMP + "/runtime-latest/package.json";
            const pkg = JSON.parse(fs.readFileSync(p, "utf8"));
            for (const dep of ["@opencode/ai", "@opencode/core", "@opencode/plugin", "@opencode/sdk"]) {
              if (pkg.devDependencies[dep]) pkg.devDependencies[dep] = "latest";
            }
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + "\n");
          '
          rm -f "$RUNNER_TEMP/runtime-latest/bun.lock"
          (cd "$RUNNER_TEMP/runtime-latest" && bun install --ignore-scripts) # NOSONAR (S8543): intentional @opencode/*@latest resolution in an isolated copy; this probe job has contents:read, no persisted checkout credential, and --ignore-scripts; reporting runs in a separate issues:write job
          node -e '
            const fs = require("fs");
            const base = process.env.RUNNER_TEMP + "/runtime-latest/node_modules";
            const versions = {};
            for (const dep of ["@opencode/ai", "@opencode/core", "@opencode/plugin", "@opencode/sdk", "effect"]) {
              try {
                versions[dep] = JSON.parse(fs.readFileSync(`${base}/${dep}/package.json`, "utf8")).version;
              } catch { versions[dep] = "missing"; }
            }
            fs.writeFileSync(process.env.RUNNER_TEMP + "/host-versions.json", JSON.stringify(versions, null, 2) + "\n");
            console.log("Resolved versions:", JSON.stringify(versions));
          '

      - name: Run L1-L3 runtime suite against @opencode/*@latest
        id: suite
        continue-on-error: true
        run: |
          set +e
          (cd "$RUNNER_TEMP/runtime-latest" && bun test --timeout 30000) > "$RUNNER_TEMP/drift-output.txt" 2>&1
          code=$?
          cat "$RUNNER_TEMP/drift-output.txt"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Upload drift diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-host-drift
          path: |
            ${{ runner.temp }}/host-versions.json
            ${{ runner.temp }}/catalog-pinned.json
            ${{ runner.temp }}/drift-output.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Upload resolved host versions on success
        if: steps.suite.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: opencode-host-versions
          path: |
            ${{ runner.temp }}/host-versions.json
            ${{ runner.temp }}/catalog-pinned.json
          retention-days: 30

  report:
    name: Report OpenCode host drift
    needs: probe
    if: always() && (needs.probe.result != 'success' || needs.probe.outputs.exit_code != '0')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Download drift diagnostics
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: opencode-host-drift
          path: ${{ runner.temp }}/host-drift

      - name: Report drift in deduplicated GitHub issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const base = process.env.RUNNER_TEMP + "/host-drift";
            const read = (name) => {
              try {
                return fs.readFileSync(path.join(base, name), "utf8");
              } catch {
                return "";
              }
            };
            const versions = read("host-versions.json").trim() || "{}";
            const output = read("drift-output.txt").slice(-6000).trim() || "(no output captured)";
            const title = "OpenCode host drift";
            const body = [
              "Nightly runtime suite failed against `@opencode/*@latest`.",
              "",
              "### Resolved versions",
              "```json",
              versions,
              "```",
              "",
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "### Failure tail",
              "```text",
              output,
              "```",
            ].join("\n");

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.data.find((i) => i.title === title && !i.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
