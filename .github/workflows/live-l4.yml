name: L4 Live-Model Prompt Fidelity (Opt-in)

# Budget-capped, workflow_dispatch-only live-model suite (Issue #38).
# Never runs on PRs; allowed to fail without blocking releases.
# Evidence of prompt fidelity only — not correctness or model judgment.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model ID (provider/model)"
        required: false
        default: "magpie/opencode-go/muse-spark-1.3-contributor"
        type: string
      max_usd:
        description: "Hard USD budget cap"
        required: false
        default: "0.50"
        type: string

permissions:
  contents: read

jobs:
  l4-live:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install runtime harness dependencies
        working-directory: tests/runtime
        run: bun install --frozen-lockfile

      - name: Run L4 live-model suite
        working-directory: tests/runtime
        env:
          TEAMWORK_LIVE: "1"
          TEAMWORK_LIVE_MODEL: ${{ inputs.model }}
          TEAMWORK_LIVE_MAX_USD: ${{ inputs.max_usd }}
        run: bun test --timeout 180000 live/l4-live.test.ts

      - name: Upload live-test log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teamwork-l4-live-log
          path: docs/re/antigravity-teamwork/live-l4-log.jsonl
          if-no-files-found: ignore
          retention-days: 30
