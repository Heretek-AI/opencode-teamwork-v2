name: Publish Package

# Publishes to npm using Trusted Publishing (OIDC) — no NPM_TOKEN secret.
#
# One-time setup on npmjs.com (after the package exists):
#   Package → Settings → Trusted Publisher → GitHub Actions
#     Organization or user : Heretek-AI
#     Repository           : opencode-teamwork-v2
#     Workflow filename    : publish.yml
#     Allowed actions      : npm publish   (npm stage publish is always allowed)
#
# Release flow:
#   npm version patch        # or edit "version" in package.json
#   git push --follow-tags   # pushes the vX.Y.Z tag -> this workflow publishes

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write # Required for OIDC trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: the release-tag guard needs origin/main
          fetch-tags: true

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never cache in release builds

      - name: Test
        run: npm test

      # Guards the npm `files` whitelist: docs/re must never ship, and the
      # published package must still contain the shipped docs and plugin entry.
      - name: Packaging guard
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node -e '
          const fs = require("fs");
          const p = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/pack.json", "utf8"));
          const paths = p[0].files.map((f) => f.path);
          const bad = paths.filter((x) => x === "docs/re" || x.startsWith("docs/re/"));
          const need = ["docs/ARTIFACTS.md", "docs/GUARDRAILS.md", "docs/ADMIN-HARDENING.md", "docs/SIGNER-PROTOCOL.md", "SECURITY.md", "docs/adr/0008-signer-spi-and-trust-levels.md", "scripts/hardening-check.sh", "plugins/opencode-teamwork/index.ts", "plugins/opencode-teamwork/auth.ts", "plugins/opencode-teamwork/authorize.ts", "plugins/opencode-teamwork/url-guard.ts", "plugins/opencode-teamwork/strict.ts", "plugins/opencode-teamwork/briefing.ts", "plugins/opencode-teamwork/victory.ts", "plugins/opencode-teamwork/safe-fs.mjs", "agents/team/victory-auditor.md"];
          const miss = need.filter((n) => !paths.includes(n));
          console.log(`packed files: ${paths.length}`);
          if (bad.length) console.error("forbidden docs/re paths:\n" + bad.join("\n"));
          if (miss.length) console.error("missing required paths:\n" + miss.join("\n"));
          process.exit(bad.length + miss.length ? 1 : 0);
          '

      # Trusted publishing (OIDC) needs npm >= 11.5.1. Prefer the latest npm but
      # fall back to the newest 11.x if the latest requires a newer Node.
      - name: Ensure recent npm
        run: |
          npm install -g npm@latest || npm install -g "npm@^11"
          npm --version
          node -e "const v=require('child_process').execSync('npm --version').toString().trim().split('.').map(Number); if(v[0]<11||(v[0]===11&&v[1]<5)){console.error('npm too old for OIDC:',v.join('.'));process.exit(1)}"

      - name: Sanity check
        run: |
          node --check lib/team.mjs
          node --check lib/picker.mjs
          node --check bin/opencode-teamwork.mjs
          node --check postinstall.mjs
          node scripts/lint-prompts.mjs
          npm pack --dry-run

      # Only new tag pushes are guarded; existing tags are never rewritten. A
      # release tag must be an ancestor of origin/main, so a tag on a detached
      # or sibling commit cannot publish code that main does not contain.
      - name: Release tag provenance
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --tags --force
          node scripts/check-release-tag.mjs

      # `repository.url` in package.json must exactly match this GitHub repo or
      # provenance/OIDC verification fails. npm generates provenance
      # automatically under trusted publishing — no --provenance flag needed.
      - name: Publish
        run: npm publish --access public
