name: Publish Package

# Publishes to npm using Trusted Publishing (OIDC) — no NPM_TOKEN secret.
#
# One-time setup on npmjs.com (after the package exists):
#   Package → Settings → Trusted Publisher → GitHub Actions
#     Organization or user : Heretek-AI
#     Repository           : opencode-teamwork-v2
#     Workflow filename    : publish.yml
#     Allowed actions      : npm publish   (npm stage publish is always allowed)
#
# Release flow:
#   npm version patch        # or edit "version" in package.json
#   git push --follow-tags   # pushes the vX.Y.Z tag -> this workflow publishes
#
# PRIVILEGE BOUNDARY
# ------------------
# `verify` runs `npm test`, the L0 parity suite, the packaging guard, the
# version/changelog/tag guard and T4 with `contents: read` only. It has no OIDC
# token and no registry credential, so a test-writable script cannot mint a
# trusted-publishing token.
#
# `publish` is the only job with `id-token: write`. The workflow has no
# `workflow_dispatch` trigger: only a pushed `v*` tag can start it, so a branch
# or a manual dispatch has no path to the OIDC-bearing job. The publish job
# starts from a fresh checkout of the same commit, downloads the tarball
# produced by `verify`, verifies its sha256, and re-packs the clean checkout
# (`--ignore-scripts`) to prove the artifact still matches the repository.
#
# The privileged job executes no script from the checkout. The tag/version
# provenance step below is inline `git`/Node rather than
# `scripts/check-release-tag.mjs`, because a tag can point at a commit whose
# test-writable scripts were modified. It then invokes `npm publish` on the
# tarball, which — unlike a directory publish — runs no repository lifecycle
# scripts either. npm itself runs from a clean temp directory with a temporary
# `NPM_CONFIG_USERCONFIG` and an explicit `--registry`, so a repository
# `.npmrc`/`.yarnrc` cannot redirect the registry, inject credentials or change
# the publish tag.
#
# ENVIRONMENT CHECKLIST (deliberately not enabled)
# ------------------------------------------------
# This job intentionally has no `environment:`. Do NOT add
# `environment: npm-publish` unless the npm Trusted Publisher entry above is
# first bound to that exact environment name. The binding is an npm-side
# setting: adding the environment here first would leave the trusted publisher
# unbound and every release would fail. To enable the gate, create the
# `npm-publish` environment with required reviewers, update the trusted
# publisher to name it, then add `environment: npm-publish` to `publish` in the
# same change.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Test and pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # full history: the release-tag guard needs origin/main
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          package-manager-cache: false # never cache in release builds

      - name: Release consistency
        # --require-clean is safe here: this is a fresh checkout before any
        # test writes, and the privileged job re-packs the same commit.
        run: node scripts/check-release-consistency.mjs --require-clean

      - name: L0 parity
        run: node scripts/test-agy-parity.mjs

      - name: Test
        run: npm test

      # Guards the npm `files` whitelist: docs/re must never ship, and the
      # published package must still contain the shipped docs and plugin entry.
      - name: Packaging guard
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node -e '
          const fs = require("fs");
          const p = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/pack.json", "utf8"));
          const paths = p[0].files.map((f) => f.path);
          const bad = paths.filter((x) => x === "docs/re" || x.startsWith("docs/re/"));
          const need = ["docs/ARTIFACTS.md", "docs/GUARDRAILS.md", "docs/ADMIN-HARDENING.md", "docs/SIGNER-PROTOCOL.md", "SECURITY.md", "docs/adr/0008-signer-spi-and-trust-levels.md", "docs/adr/0014-verifiable-witness-and-signer-v2.md", "docs/adr/0015-offline-verification.md", "scripts/hardening-check.sh", "plugins/opencode-teamwork/index.ts", "plugins/opencode-teamwork/auth.ts", "plugins/opencode-teamwork/authorize.ts", "plugins/opencode-teamwork/url-guard.mjs", "plugins/opencode-teamwork/strict.ts", "plugins/opencode-teamwork/briefing.ts", "plugins/opencode-teamwork/victory.ts", "plugins/opencode-teamwork/safe-fs.mjs", "lib/verify.mjs", "scripts/test-verify.mjs", "agents/team/victory-auditor.md", "docs/RELEASE-RUNBOOK.md", "scripts/check-release-consistency.mjs", "scripts/test-release-consistency.mjs"];
          const miss = need.filter((n) => !paths.includes(n));
          console.log(`packed files: ${paths.length}`);
          if (bad.length) console.error("forbidden docs/re paths:\n" + bad.join("\n"));
          if (miss.length) console.error("missing required paths:\n" + miss.join("\n"));
          process.exit(bad.length + miss.length ? 1 : 0);
          '

      # Trusted publishing (OIDC) needs npm >= 11.5.1. Prefer the latest npm but
      # fall back to the newest 11.x if the latest requires a newer Node.
      # Both jobs pin the same npm version so `npm pack` is byte-identical.
      #
      # Run from a clean temp directory: npm reads `.npmrc` relative to the
      # working directory, and the consistency guard rejects a committed
      # `.npmrc`. The empty user config keeps this install independent of any
      # file in the checkout.
      - name: Ensure recent npm
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npm-userconfig
        run: |
          : > "$NPM_CONFIG_USERCONFIG"
          mkdir -p "$RUNNER_TEMP/npm-clean"
          cd "$RUNNER_TEMP/npm-clean"
          npm install -g --ignore-scripts --registry=https://registry.npmjs.org npm@11.21.3
          npm --version
          node -e "const v=require('child_process').execSync('npm --version').toString().trim().split('.').map(Number); if(v[0]<11||(v[0]===11&&v[1]<5)){console.error('npm too old for OIDC:',v.join('.'));process.exit(1)}"

      - name: Sanity check
        run: |
          node --check lib/team.mjs
          node --check lib/picker.mjs
          node --check bin/opencode-teamwork.mjs
          node --check postinstall.mjs
          node scripts/lint-prompts.mjs
          npm pack --dry-run

      # Only new tag pushes are guarded; existing tags are never rewritten. A
      # release tag must be an ancestor of origin/main, so a tag on a detached
      # or sibling commit cannot publish code that main does not contain. This
      # unprivileged job may run the repository guard; the privileged job
      # repeats the check inline without executing a checkout script.
      - name: Release tag provenance
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --tags --force
          node scripts/check-release-tag.mjs

      # T4: pack the tarball, install into a clean project, verify sha256 and
      # file whitelist, and run L1 catalog/commands specs against the install.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install runtime harness dependencies (T4)
        working-directory: tests/runtime
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Packed-tarball install test (T4)
        run: node scripts/test-packed-tarball.mjs

      # Build the exact artifact the privileged job will publish. The tests
      # above can modify the worktree; `publish` re-packs a clean checkout with
      # --ignore-scripts and refuses to publish if the digest differs.
      #
      # Pack from a clean temp cwd with an empty user config, mirroring the
      # privileged job exactly, so `npm pack <checkout>` is the only npm input
      # from the repository.
      - name: Build the release tarball
        id: release
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npm-pack-userconfig
          WORKSPACE: ${{ github.workspace }}
        run: |
          : > "$NPM_CONFIG_USERCONFIG"
          mkdir -p "$RUNNER_TEMP/npm-pack" "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/npm-pack"
          npm pack --json --pack-destination "$RUNNER_TEMP/release" "$WORKSPACE" > "$RUNNER_TEMP/pack-release.json"
          node -e '
          const fs = require("fs");
          const path = require("path");
          const crypto = require("crypto");
          const dir = process.env.RUNNER_TEMP + "/release";
          const meta = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/pack-release.json", "utf8"))[0];
          if (!meta || !/^[A-Za-z0-9._-]+\.tgz$/.test(String(meta.filename ?? ""))) {
            console.error("npm pack returned an unsafe tarball filename");
            process.exit(1);
          }
          const pkg = JSON.parse(fs.readFileSync(path.join(process.env.WORKSPACE, "package.json"), "utf8"));
          if (meta.name !== pkg.name || meta.version !== pkg.version) {
            console.error(`packed ${meta.name}@${meta.version} does not match package.json ${pkg.name}@${pkg.version}`);
            process.exit(1);
          }
          const tarball = path.join(dir, meta.filename);
          const sha256 = crypto.createHash("sha256").update(fs.readFileSync(tarball)).digest("hex");
          fs.writeFileSync(path.join(dir, "release.json"), JSON.stringify({
            filename: meta.filename,
            name: meta.name,
            version: meta.version,
            sha256,
          }, null, 2) + "\n");
          fs.writeFileSync(path.join(dir, "tarball.sha256"), `${sha256}  ${meta.filename}\n`);
          console.log(`release tarball: ${meta.filename}`);
          console.log(`sha256:          ${sha256}`);
          '
          test -s "$RUNNER_TEMP/release/tarball.sha256"

      - name: Upload the release tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-release-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified tarball
    needs: verify
    # The workflow only runs on a pushed `v*` tag; this repeats the gate at the
    # job level so a future trigger cannot reach the OIDC-token-bearing job.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for OIDC trusted publishing
    steps:
      # Fresh checkout at the same commit. Nothing from the test job's writable
      # workspace is reused; only its tarball artifact is consumed below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # No `registry-url`: it writes a runner-level `.npmrc` that would compete
      # with the explicit temp user config below. Every npm command passes
      # `--registry=https://registry.npmjs.org` instead.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          package-manager-cache: false # never cache in release builds

      # Run npm from a clean temp directory with an empty user config so no
      # `.npmrc` can reach the install, the pack or the publish.
      - name: Ensure recent npm
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npm-userconfig
        run: |
          : > "$NPM_CONFIG_USERCONFIG"
          mkdir -p "$RUNNER_TEMP/npm-clean"
          cd "$RUNNER_TEMP/npm-clean"
          npm install -g --ignore-scripts --registry=https://registry.npmjs.org npm@11.21.3
          npm --version

      - name: Download the release tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-release-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release

      # Verify before the OIDC token can be used: the artifact hash must match
      # its manifest, the version must match this checkout, and a fresh
      # `npm pack` of the clean checkout must be byte-identical. A test-mutated
      # worktree in `verify` therefore cannot smuggle a different tarball here.
      - name: Verify the tarball against the clean checkout
        id: verify
        # --ignore-scripts means this privileged job executes no repository
        # lifecycle code. A package that needs a `prepare`/`prepack` step will
        # not match the tested tarball and publishing stops (fail closed).
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npm-pack-userconfig
          WORKSPACE: ${{ github.workspace }}
        run: |
          : > "$NPM_CONFIG_USERCONFIG"
          mkdir -p "$RUNNER_TEMP/npm-repack" "$RUNNER_TEMP/repack"
          cd "$RUNNER_TEMP/npm-repack"
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/repack" "$WORKSPACE" > "$RUNNER_TEMP/repack.json"
          node -e '
          const fs = require("fs");
          const path = require("path");
          const crypto = require("crypto");
          const fail = (message) => { console.error(`verify-release: ${message}`); process.exit(1); };
          const dir = process.env.RUNNER_TEMP + "/release";
          let meta;
          try {
            meta = JSON.parse(fs.readFileSync(path.join(dir, "release.json"), "utf8"));
          } catch (err) {
            fail(`release.json is unreadable (${err?.message ?? err})`);
          }
          if (!/^[A-Za-z0-9._-]+\.tgz$/.test(String(meta.filename ?? ""))) fail("unsafe tarball filename");
          const tarball = path.join(dir, meta.filename);
          let bytes;
          try {
            bytes = fs.readFileSync(tarball);
          } catch (err) {
            fail(`tarball is unreadable (${err?.message ?? err})`);
          }
          const sha256 = crypto.createHash("sha256").update(bytes).digest("hex");
          if (sha256 !== meta.sha256) fail("tarball sha256 does not match release.json");
          let recorded;
          try {
            recorded = fs.readFileSync(path.join(dir, "tarball.sha256"), "utf8").trim().split(/\s+/)[0];
          } catch (err) {
            fail(`tarball.sha256 is unreadable (${err?.message ?? err})`);
          }
          if (recorded !== sha256) fail("tarball.sha256 does not match the downloaded tarball");
          const pkg = JSON.parse(fs.readFileSync(path.join(process.env.WORKSPACE, "package.json"), "utf8"));
          if (meta.name !== pkg.name || meta.version !== pkg.version) {
            fail(`artifact ${meta.name}@${meta.version} does not match package.json ${pkg.name}@${pkg.version}`);
          }
          let repacked;
          try {
            repacked = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/repack.json", "utf8"))[0];
          } catch (err) {
            fail(`npm pack --json is unreadable (${err?.message ?? err})`);
          }
          if (!repacked || !/^[A-Za-z0-9._-]+\.tgz$/.test(String(repacked.filename ?? ""))) {
            fail("npm pack returned an unsafe tarball filename");
          }
          const repackPath = path.join(process.env.RUNNER_TEMP, "repack", repacked.filename);
          const repackSha = crypto.createHash("sha256").update(fs.readFileSync(repackPath)).digest("hex");
          if (repackSha !== sha256) {
            fail("downloaded tarball does not match a fresh pack of the clean checkout");
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tarball_path=${tarball}\n`);
          console.log(`verified ${meta.filename} (sha256 ${sha256}) against the clean checkout`);
          '

      # Privileged-job guard, inline on purpose: the OIDC-bearing job must not
      # execute scripts/check-release-tag.mjs (or any other script) from the
      # checkout, because the tag can point at a commit whose test-writable
      # files were modified. The workflow definition itself is loaded from the
      # tag ref, so CODEOWNERS on `.github/workflows/` and the tag ruleset are
      # the outer guard; this check is defence in depth. Never rewrite a tag.
      - name: Release tag provenance and version (inline)
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9A-Za-z][0-9A-Za-z._-]{0,63}$ ]]; then
            echo "::error::refusing to publish: invalid release tag name $tag"
            exit 1
          fi
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const pkg = JSON.parse(fs.readFileSync(path.join(process.env.GITHUB_WORKSPACE, "package.json"), "utf8"));
          const expected = "v" + pkg.version;
          const actual = process.env.GITHUB_REF_NAME;
          if (actual !== expected) {
            console.error("refusing to publish: tag " + actual + " does not match package.json " + expected);
            process.exit(1);
          }
          // Privileged copy of the consistency rule: npm applies the tarball
          // publishConfig during publish, so a registry/tag/provenance key
          // could override the explicit flags below.
          if (pkg.publishConfig !== undefined) {
            const publishConfig = pkg.publishConfig;
            if (publishConfig === null || typeof publishConfig !== "object" || Array.isArray(publishConfig)) {
              console.error("refusing to publish: package.json publishConfig is not an object");
              process.exit(1);
            }
            const forbidden = Object.keys(publishConfig).filter((key) => key !== "access");
            if (forbidden.length > 0) {
              console.error("refusing to publish: publishConfig has forbidden key(s) " + forbidden.join(", ") + '; only "access" is allowed');
              process.exit(1);
            }
          }
          NODE
          git fetch --tags --force origin
          git fetch --force origin "main:refs/remotes/origin/main"
          if ! git rev-parse --verify --quiet "refs/tags/${tag}^{commit}" > /dev/null; then
            echo "::error::refusing to publish: tag ${tag} does not resolve"
            exit 1
          fi
          tag_commit="$(git rev-parse "refs/tags/${tag}^{commit}")"
          if ! git merge-base --is-ancestor "$tag_commit" "refs/remotes/origin/main"; then
            echo "::error::refusing to publish: ${tag} (${tag_commit:0:12}) is not an ancestor of origin/main"
            exit 1
          fi
          echo "tag ${tag} (${tag_commit:0:12}) is an ancestor of origin/main"

      # `repository.url` in package.json must exactly match this GitHub repo or
      # provenance/OIDC verification fails. npm generates provenance
      # automatically under trusted publishing — no --provenance flag needed.
      # Publishing a tarball runs no repository lifecycle scripts. The temp
      # cwd and empty user config mean no checkout `.npmrc` is consulted; the
      # registry and dist-tag are explicit.
      - name: Publish
        env:
          TARBALL: ${{ steps.verify.outputs.tarball_path }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npm-publish-userconfig
        run: |
          : > "$NPM_CONFIG_USERCONFIG"
          mkdir -p "$RUNNER_TEMP/npm-publish"
          cd "$RUNNER_TEMP/npm-publish"
          npm publish --registry=https://registry.npmjs.org --tag latest --access public "$TARBALL"
