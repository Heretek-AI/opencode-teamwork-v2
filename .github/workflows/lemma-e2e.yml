name: LEMMA live toolchain E2E

on:
  pull_request:
    paths:
      - "plugins/**"
      - "agents/**"
      - "scripts/**"
      - ".github/workflows/lemma-e2e.yml"
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "agents/**"
      - "scripts/**"
      - ".github/workflows/lemma-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lemma-e2e:
    name: Live Lean 4 + LEAP CLI (no Mathlib)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          package-manager-cache: false

      # setup-python keeps `python3 -m pip install --user` working on
      # Ubuntu 24.04, whose system Python is externally managed (PEP 668).
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Cache elan toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-lean4-stable-v2
          restore-keys: |
            ${{ runner.os }}-elan-lean4-stable-

      # lean-action installs elan and reads the toolchain from
      # lean-toolchain. This repo is not a Lake package, so point it at a
      # throwaway core-only package and disable every build/test feature.
      - name: Prepare core-only Lean package
        run: |
          mkdir -p "$RUNNER_TEMP/lean-core"
          printf 'leanprover/lean4:stable\n' > "$RUNNER_TEMP/lean-core/lean-toolchain"
          printf '{}\n' > "$RUNNER_TEMP/lean-core/lake-manifest.json"

      - name: Install elan + Lean 4 stable (core only, no Mathlib)
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          mk_all-check: "false"
          use-mathlib-cache: "false"
          use-github-cache: "false"
          lake-package-directory: ${{ runner.temp }}/lean-core

      # A restored ~/.elan cache can contain the toolchain without a configured
      # default (lean-action with auto-config:false does not set one), which
      # makes `lean --version` fail with "no default toolchain configured".
      # Pin it explicitly so cold and warm cache runs behave the same.
      - name: Configure elan default toolchain
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install leanprover/lean4:stable
          elan default leanprover/lean4:stable
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lean --version
          lake --version

      # The `leap-tools` PyPI package does not exist. Build the pinned git
      # revision (and its wheels) first, then install binary-only so no
      # source build or index resolution happens at install time.
      # `leap lean` (Lean 4.34 + Mathlib, ~11 GB) is deliberately NOT run:
      # LEMMA verification needs only core Lean.
      - name: Build LEAP CLI wheel (pinned git revision, no Mathlib)
        run: |
          mkdir -p "$RUNNER_TEMP/wheels"
          python3 -m pip wheel "git+https://github.com/billkunghappy/LEAP-CLI@afc016d23579d8236050a157fe6cac8f17b13096" -w "$RUNNER_TEMP/wheels"

      - name: Install LEAP CLI wheel (binary only, no Mathlib)
        run: |
          python3 -m pip install --user --only-binary :all: --no-index --find-links "$RUNNER_TEMP/wheels" leap-cli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$HOME/.local/bin:$PATH"
          lean --version
          lake --version
          leap --help

      - name: Configure runtime PATH
        run: |
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Diagnostics only: never fail the job here. The test step below stays
      # strict ("live E2E must run, not skip"), and this log explains a skip.
      - name: Record LEMMA toolchain
        continue-on-error: true
        run: |
          {
            echo "== command -v =="
            for bin in lean lake leap state_manager_bin lean_verifier_tool_bin lean_search_tool_bin; do
              printf '%s: ' "$bin"
              command -v "$bin" || echo "MISSING"
            done
            echo "== lean --version =="
            lean --version || true
            echo "== lake --version =="
            lake --version || true
            echo "== leap --help (head -5) =="
            leap --help 2>&1 | head -5 || true
            echo "== leap doctor --offline =="
            leap doctor --offline || true
          } 2>&1 | tee "$RUNNER_TEMP/toolchain.txt"

      - name: Tests (live LEMMA E2E must run, not skip)
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/npm-test.log"
          if grep -F "[SKIP] LEMMA live-toolchain" "$RUNNER_TEMP/npm-test.log"; then
            echo "::error::LEMMA live-toolchain E2E was skipped; the probe did not see lean/lake/leap on PATH"
            exit 1
          fi
          grep -F "live Lean 4 E2E verification passed" "$RUNNER_TEMP/npm-test.log"

      - name: Upload LEMMA E2E diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lemma-e2e-diagnostics
          path: |
            ${{ runner.temp }}/npm-test.log
            ${{ runner.temp }}/toolchain.txt
          if-no-files-found: warn
