name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v7

      # The package has no dependencies; every script uses Node built-ins only.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Test
        run: npm test

      # Guards the npm `files` whitelist: docs/re must never ship, and the
      # published package must still contain the shipped docs and plugin entry.
      - name: Packaging guard
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node -e '
          const fs = require("fs");
          const p = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/pack.json", "utf8"));
          const paths = p[0].files.map((f) => f.path);
          const bad = paths.filter((x) => x === "docs/re" || x.startsWith("docs/re/"));
          const need = ["docs/ARTIFACTS.md", "docs/GUARDRAILS.md", "docs/adr/0005-artifact-authenticity.md", "docs/adr/0008-signer-spi-and-trust-levels.md", "SECURITY.md", "plugins/opencode-teamwork/index.ts", "plugins/opencode-teamwork/auth.ts", "plugins/opencode-teamwork/authorize.ts", "plugins/opencode-teamwork/url-guard.ts", "plugins/opencode-teamwork/strict.ts", "plugins/opencode-teamwork/briefing.ts", "plugins/opencode-teamwork/victory.ts", "plugins/opencode-teamwork/safe-fs.mjs", "agents/team/victory-auditor.md"];
          const miss = need.filter((n) => !paths.includes(n));
          console.log(`packed files: ${paths.length}`);
          if (bad.length) console.error("forbidden docs/re paths:\n" + bad.join("\n"));
          if (miss.length) console.error("missing required paths:\n" + miss.join("\n"));
          process.exit(bad.length + miss.length ? 1 : 0);
          '
