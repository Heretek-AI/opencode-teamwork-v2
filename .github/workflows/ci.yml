name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # L1/L2: the real plugin inside the real OpenCode 2.4.1 runtime, with no model
  # call and no network at test time. Dependencies are pinned in
  # tests/runtime/package.json; the root package stays dependency-free.
  runtime-l1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install harness dependencies
        working-directory: tests/runtime
        run: bun install --frozen-lockfile --ignore-scripts

      - name: L1/L2/L3 runtime suite
        working-directory: tests/runtime
        run: bun test --timeout 30000

  signer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test reference non-oracle signer (Rust)
        run: cargo test --manifest-path signer/Cargo.toml

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v7

      # The package has no dependencies; every script uses Node built-ins only.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Test
        run: npm test

      # Guards the npm `files` whitelist: docs/re must never ship, and the
      # published package must still contain the shipped docs and plugin entry.
      - name: Packaging guard
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node -e '
          const fs = require("fs");
          const p = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/pack.json", "utf8"));
          const paths = p[0].files.map((f) => f.path);
          const bad = paths.filter((x) => x === "docs/re" || x.startsWith("docs/re/") || x === "tests" || x.startsWith("tests/") || x === "signer" || x.startsWith("signer/"));
          const need = ["docs/ARTIFACTS.md", "docs/GUARDRAILS.md", "docs/ADMIN-HARDENING.md", "docs/SIGNER-PROTOCOL.md", "docs/adr/0005-artifact-authenticity.md", "docs/adr/0008-signer-spi-and-trust-levels.md", "docs/adr/0014-verifiable-witness-and-signer-v2.md", "docs/adr/0015-offline-verification.md", "docs/adr/0018-ci-attestation.md", "SECURITY.md", "scripts/hardening-check.sh", "scripts/attest-sign.mjs", "plugins/opencode-teamwork/index.ts", "plugins/opencode-teamwork/auth.ts", "plugins/opencode-teamwork/attestation.mjs", "plugins/opencode-teamwork/authorize.ts", "plugins/opencode-teamwork/url-guard.ts", "plugins/opencode-teamwork/strict.ts", "plugins/opencode-teamwork/briefing.ts", "plugins/opencode-teamwork/victory.ts", "plugins/opencode-teamwork/safe-fs.mjs", "lib/verify.mjs", "scripts/test-verify.mjs", "agents/team/victory-auditor.md"];
          const miss = need.filter((n) => !paths.includes(n));
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const deps = Object.keys(pkg.dependencies ?? {});
          console.log(`packed files: ${paths.length}`);
          if (bad.length) console.error("forbidden docs/re or tests paths:\n" + bad.join("\n"));
          if (miss.length) console.error("missing required paths:\n" + miss.join("\n"));
          if (deps.length) console.error("root dependencies must stay empty:\n" + deps.join("\n"));
          process.exit(bad.length + miss.length + deps.length ? 1 : 0);
          '
