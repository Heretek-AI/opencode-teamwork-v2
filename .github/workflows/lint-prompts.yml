name: Lint prompts

# No `paths:` filter on purpose. `lint` is a required status check for `main`;
# a path-filtered workflow does not report the check on a pull request that
# touches no matching path, which leaves the required check pending forever
# (the "expected" deadlock). Run it on every push and pull request instead; the
# linter is Node-only and fast.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      # The linter uses only Node built-ins.
      - run: node scripts/lint-prompts.mjs
